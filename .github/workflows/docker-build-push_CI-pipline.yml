name: docker-build-push_CI-pipline
run-name: ${{github.actor}}
on: push
jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Lint Dockerfile with Hadolint
      #used add button instead of copy
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: sample/Dockerfile
          ignore: DL4000

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USR }}
          password: ${{ secrets.DOCKER_PASS }}
          #updated the password in variable
          
      # 4. Build Docker image
      - name: Build Docker image
        run: docker build -t kum18/helloworld-python:v1 -f sample/Dockerfile .
      # diagnostic outpu
      - name: Verify Docker login
        run: docker info

      # 4.5. Scan Docker image with Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kum18/helloworld-python:v1
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


      # 5. Push Docker image
      - name: Push Docker image
        run: docker push kum18/helloworld-python:v1        
      
      # 6. Run the container
      - name: Run the container
        run: docker run --name helloworld-demo-python -itd -p 8080:8080 kum18/helloworld-python:v1

      # 7. View the image
      - name: View the image
        run: docker ps
